name: production-auth-smoke

on:
  schedule:
    - cron: "41 */6 * * *"
  workflow_dispatch:
    inputs:
      web_base:
        description: Web origin to verify
        required: false
        default: https://www.citylens.dev
        type: string
      diagnostic_public_key_b64:
        description: Optional one-time DER public key for encrypted browser diagnostics
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: production-auth-smoke
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CITYLENS_WEB_BASE: ${{ inputs.web_base || 'https://www.citylens.dev' }}
      CITYLENS_WEB_SMOKE_EMAIL: ${{ secrets.CITYLENS_WEB_SMOKE_EMAIL }}
      CITYLENS_WEB_SMOKE_PASSWORD: ${{ secrets.CITYLENS_WEB_SMOKE_PASSWORD }}
      CITYLENS_DIAGNOSTIC_PUBLIC_KEY_B64: ${{ inputs.diagnostic_public_key_b64 }}
    steps:
      - name: Check out verifier
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 20.19.0
          cache: npm

      - run: npm ci
      - run: npx playwright install --with-deps chromium

      - name: Verify real signed-in Parcel Intelligence map
        run: node scripts/verify-production-authenticated-parcel-map.mjs

      - name: Publish verification summary
        if: always()
        run: |
          node - <<'NODE' >> "${GITHUB_STEP_SUMMARY}"
          const fs = require('node:fs');
          const path = 'test-results/production-auth-smoke/report.json';
          const report = fs.existsSync(path)
            ? JSON.parse(fs.readFileSync(path, 'utf8'))
            : null;
          const passed = Boolean(report?.passed);
          console.log(`## ${passed ? '✅' : '❌'} Real browser authentication`);
          console.log('');
          console.log(`- Signed-in API credential: \`${report?.auth_token_receipts?.some((receipt) => receipt.status === 200 && receipt.jwt_shape === true) ? 'passed' : 'failed'}\``);
          console.log(`- Signed-in 5,000-parcel clustered map: \`${report?.initial_clustered_map_receipt?.match_count === 5000 && report?.initial_clustered_map_receipt?.cluster_count > 0 ? 'passed' : 'failed'}\``);
          console.log(`- Site-ranked decision list: \`${report?.site_ranking_receipt?.parcel_count === 5000 && report?.site_ranking_receipt?.site_count === report?.site_ranking_receipt?.api_site_count ? `passed · ${report.site_ranking_receipt.site_count.toLocaleString()} sites across 5,000 parcels` : 'failed'}\``);
          console.log(`- Authenticated preview race: \`${report?.authenticated_public_preview_receipt_count === 0 ? 'absent' : 'detected'}\``);
          console.log(`- Mobile full-access, map-first workspace: \`${report?.mobile_workspace_receipt?.access_status === 'Full access' && report?.mobile_workspace_receipt?.match_count === 5000 && report?.mobile_workspace_receipt?.market_filters_collapsed === true && report?.mobile_workspace_receipt?.workspace_tools_collapsed === true && report?.mobile_workspace_receipt?.map_within_first_viewport === true ? `passed · map starts at ${report.mobile_workspace_receipt.map_top_px}px` : 'failed'}\``);
          console.log(`- Returning-session 5,000-parcel reload: \`${report?.returning_session_reload_verified ? 'passed' : 'failed'}\``);
          console.log(`- Private saved-screen create/count/delete: \`${report?.saved_screen_receipt?.created_count === report?.saved_screen_receipt?.initial_count + 1 && report?.saved_screen_receipt?.header_count_after_create === report?.saved_screen_receipt?.created_count && report?.saved_screen_receipt?.browse_focus_verified && report?.saved_screen_receipt?.cleanup_verified ? `passed · restored ${report.saved_screen_receipt.restored_count} · cleared ${report.saved_screen_receipt.stale_smoke_views_removed ?? 0} stale smoke view(s)` : 'failed'}\``);
          console.log(`- Complete unique-BBL citywide CSV: \`${report?.citywide_export_receipt?.row_count === 5000 && report?.citywide_export_receipt?.unique_bbl_count === 5000 && report?.citywide_export_receipt?.consistent_column_count === true ? 'passed' : 'failed'}\``);
          console.log(`- Citywide CSV delivery: \`${report?.citywide_export_receipt?.file_bytes ? `${(report.citywide_export_receipt.file_bytes / 1_000_000).toFixed(2)} MB in ${(report.citywide_export_receipt.duration_ms / 1_000).toFixed(1)}s` : 'unavailable'}\``);
          console.log(`- Auditable historical benchmark receipt: \`${report?.historical_benchmark_receipt_verified ? 'passed' : 'failed'}\``);
          console.log(`- Temporal train → calibrate → current-inference lineage: \`${report?.model_lineage_receipt_verified ? 'passed' : 'failed'}\``);
          console.log(`- Live prospective cohort boundary: \`${report?.prospective_validation_receipt?.health === 'current' && report?.prospective_validation_receipt?.claim_boundary_visible ? `passed · ${report.prospective_validation_receipt.status}` : 'failed'}\``);
          console.log(`- Private workflow-outcome evidence: \`${report?.workflow_outcome_receipt?.shape_valid && report?.workflow_outcome_receipt?.maturity_boundary_safe && report?.workflow_outcome_receipt?.evidence_boundary_visible && report?.workflow_outcome_receipt?.maturity_boundary_visible && report?.workflow_outcome_receipt?.focus_restored ? `passed · ${report.workflow_outcome_receipt.cohort_state}` : 'failed'}\``);
          console.log(`- Any-NYC-lot official dossier: \`${report?.official_dossier_verified ? 'passed' : 'failed'}\``);
          console.log(`- Source-grounded dossier readiness: \`${report?.dossier_readiness_verified ? 'passed' : 'failed'}\``);
          console.log(`- Official comparable-sale screen: \`${report?.sales_comparables_verified ? 'passed' : 'failed'}\``);
          console.log(`- Systematic private lead-review workspace: \`${report?.lead_review_workspace_receipt?.status === 200 && report?.lead_review_workspace_receipt?.available_count === 5000 && report?.lead_review_workspace_receipt?.counts_reconcile && report?.lead_review_workspace_receipt?.mutation_requested === false ? `passed · ${report.lead_review_workspace_receipt.reviewed_count.toLocaleString()} reviewed` : 'failed'}\``);
          console.log(`- Private generation-bound lead review: \`${report?.lead_review_contract_receipt?.status === 200 && report?.lead_review_contract_receipt?.card_state === 'ready' && report?.lead_review_contract_receipt?.mutation_requested === false ? 'passed · read-only smoke' : 'failed'}\``);
          console.log(`- Official address → BBL → screening flow: \`${report?.address_resolution_verified ? 'passed' : 'failed'}\``);
          console.log(`- Governed acquisition-thesis flow: \`${report?.thesis_composer_verified ? 'passed' : 'failed'}\``);
          console.log(`- Value-minimized thesis event: \`${report?.thesis_composer_event_receipt?.value_minimized ? 'passed' : 'failed'}\``);
          console.log(`- Signed-in run history: \`${report?.run_operations_receipt?.list_api_verified && report?.run_operations_receipt?.summary_counts_match ? `passed · ${report.run_operations_receipt.history_state}` : 'failed'}\``);
          console.log(`- Owned run detail: \`${report?.run_operations_receipt?.detail_state === 'verified' ? `passed · ${report.run_operations_receipt.detail_output_state}` : report?.run_operations_receipt?.detail_state === 'not_available_empty_history' ? 'not available · empty history' : 'failed'}\``);
          console.log(`- Value-minimized run receipt: \`${report?.run_operations_receipt?.value_minimized && report?.run_list_receipts?.every((receipt) => receipt.value_minimized) ? 'passed' : 'failed'}\``);
          console.log(`- Browser console errors: \`${report?.console_error_count ?? 'unknown'}\``);
          console.log(`- Browser page errors: \`${report?.page_error_count ?? 'unknown'}\``);
          if (report?.console_error_receipts?.length) console.log(`- Console error receipts: \`${JSON.stringify(report.console_error_receipts)}\``);
          if (report?.page_error_receipts?.length) console.log(`- Page error receipts: \`${JSON.stringify(report.page_error_receipts)}\``);
          if (report?.failure) console.log(`- Failure: \`${report.failure}\``);
          NODE

      - name: Upload sanitized verification artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: production-auth-smoke
          path: test-results/production-auth-smoke/
          if-no-files-found: warn
          retention-days: 14
