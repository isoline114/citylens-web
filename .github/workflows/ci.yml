name: ci

on:
  push:
    branches:
      # Default branch is `main`; `master` is listed too so this still
      # works if the repo is renamed or aligned with sibling repos.
      # PRs already trigger via `pull_request:`.
      - main
      - master
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    # The homepage SSR fetches /v1/demo/featured at build time (ISR
    # prerender). In CI, that fetch would either bake stale prod data
    # into the static HTML (breaking e2e mocks) or hit a quota. Disable
    # it for the entire workflow so the build short-circuits to [] and
    # the client-side fetch is what runs at request time.
    env:
      CITYLENS_DISABLE_SSR_DEMOS: '1'
      # The parcel explorer shell is rendered during `next build`; pin it to
      # a versioned fixture so PR geometry is never changed by live API data.
      CITYLENS_USE_PARCEL_INTEL_INDEX_FIXTURE: '1'
      # NEXT_PUBLIC_* values are baked into the Next.js bundle during build.
      # Authenticated E2E journeys seed a mock browser user, so CI must choose
      # the mock provider before `npm run build`, not only when Playwright
      # starts the already-built server.
      NEXT_PUBLIC_AUTH_PROVIDER: 'mock'
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 20.19.0
          cache: npm

      - run: npm ci
      - name: Audit dependencies
        run: npm audit --audit-level=high
      - run: npx playwright install --with-deps chromium

      - run: npm run lint

      - run: npm run build

      - run: npm test

      - run: npm run test:e2e
